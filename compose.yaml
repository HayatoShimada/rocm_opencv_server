services:
  server:
    build:
      context: .
      target: server
      args:
        ROCM_IMAGE_TAG: "10.0.0-full"
    image: rocm-opencv-server
    # 画像処理のエンドポイントは認証なしなので、ホストの 127.0.0.1 だけで受ける。
    # tailnet には `tailscale serve --bg --tcp 8000 tcp://127.0.0.1:8000` で出す（README 参照）
    ports:
      - "127.0.0.1:8000:8000"
    # ROCm コンテナから GPU を使うためのデバイスと権限
    devices:
      - /dev/kfd
      - /dev/dri
    # ROCm 10 のイメージには render グループが無いので、ホストの GID を数値で渡す
    # （`getent group video render` で確認。違う場合は .env で上書きする）
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    security_opt:
      - seccomp=unconfined
    # Shopify の認証情報と API_TOKEN（.env.example を参照）
    env_file:
      - path: .env
        required: false
    environment:
      USE_OPENCL: "true"
    restart: unless-stopped

  # PiCar-X（85pi4）の猫の検出（app/snoo.py）。UDP 8710 で受ける。
  # tailscale serve は UDP を通せず、LAN からも受けるので、ホストのネットワークで動かす
  snoo:
    build:
      context: .
      target: snoo
      args:
        ROCM_IMAGE_TAG: "10.0.0-full"
    image: rocm-opencv-server-snoo
    network_mode: host
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-992}"
    security_opt:
      - seccomp=unconfined
    environment:
      # 家の中では Pi は tailscale を通さず LAN の IP に送る（往復が約 3 ms 縮む）。
      # 0.0.0.0 で受け、認証の無い UDP なので SNOO_ALLOW の送り元（85pi4 の LAN と tailscale の IP）以外は捨てる
      SNOO_HOST: "${SNOO_HOST:-0.0.0.0}"
      SNOO_ALLOW: "${SNOO_ALLOW:-192.168.0.188,100.73.14.8}"
      SNOO_PORT: "${SNOO_PORT:-8710}"
      # 検出を torch.compile（HIP グラフ）で動かす。準備の結果は torch-compile ボリュームに残す
      SNOO_COMPILE: "${SNOO_COMPILE:-1}"
      # フレームを処理している間 1 秒ごとに触る。ホストの deploy/snoo-gpu-perf.sh がこれを見て、
      # 検出が動いている間だけ GPU の時計を上げる（止まれば 3 秒で auto に戻す）
      SNOO_ACTIVE_FILE: /run/snoo/active
      # 猫が写っている間のフレームを学習用に保存する（app/snoo_record.py。10 枚/秒まで）
      SNOO_RECORD_DIR: /app/data/snoo_rec
      SNOO_RECORD_FPS: "${SNOO_RECORD_FPS:-10}"
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/torch-compile/inductor
      TRITON_CACHE_DIR: /root/.cache/torch-compile/triton
    # snoo の見本（scripts/snoo_gallery.py で作る）と、
    # 検出モデル（Hugging Face）を作り直しのたびに取りに行かないためのキャッシュ
    volumes:
      - ./data/snoo:/app/data/snoo:ro
      # 録画（ファイルの持ち主はこのディレクトリの持ち主に揃える）と、場面の名前を日本時間にするための時刻帯
      - ./data/snoo_rec:/app/data/snoo_rec
      - /etc/localtime:/etc/localtime:ro
      - hf-cache:/root/.cache/huggingface
      - torch-compile:/root/.cache/torch-compile
      - /run/snoo:/run/snoo
    restart: unless-stopped

volumes:
  hf-cache:
  torch-compile:
